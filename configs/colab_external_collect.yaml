# Rejection-sampling fine-tuning (RFT): the stable policy-improvement method.
#
# Pure REINFORCE collapsed on this task when every sampled rewrite lost to the
# original question: an all-negative batch pushed the policy off its pretrained
# distribution. RFT samples candidates, scores them on the canonical passage,
# keeps the best valid rewrite that is at least as good as the original, and
# teacher-forces only that sequence. Samples with no good candidate are skipped.
device: cuda
seed: 42
cpu_threads: 4
data:
  dataset: ai4bharat/IndicQA
  config: indicqa.te
  cache_dir: data/cache
  external_train_dataset: nlpctx/activeqa-telugu-rl-data
  external_train_file: data/indic_rag_te/train.jsonl
  external_dev_file: data/indic_rag_te/dev.jsonl
  train_examples: null
  eval_examples: null
  eval_fraction: 0.2
models:
  reformulator: ai4bharat/MultiIndicParaphraseGenerationSS
  qa: l3cube-pune/telugu-question-answering-squad-bert
  cache_dir: models
  lora_rank: 8
  lora_alpha: 16
generation:
  candidates_per_question: 8
  max_input_tokens: 96
  max_new_tokens: 64
  do_sample: true
retrieval:
  top_k: 3
  max_context_chars: 1200
training:
  collect_selector_data: true
  method: rft
  epochs: 2
  learning_rate: 0.00005
  batch_questions: 8
  min_reward_margin: 0.0
  gradient_clip_norm: 1.0
  keep_step_checkpoints: true
  checkpoint_every_steps: 25
  checkpoint: outputs/external_rft_policy.pt
evaluation:
  selection: ranker
  ranker_weights: models/selector_weights.json
  do_sample: true
  retrieval_metrics: false
outputs: outputs
