# Leakage-safe run: RL training uses the generated Indic-Rag-Suite Telugu train
# set; the full IndicQA Telugu test split remains held out for evaluation.
device: cuda
seed: 42
cpu_threads: 4
data:
  dataset: ai4bharat/IndicQA
  config: indicqa.te
  cache_dir: data/cache
  external_train_dataset: nlpctx/activeqa-telugu-rl-data
  external_train_file: data/indic_rag_te/train.jsonl
  external_dev_file: data/indic_rag_te/dev.jsonl
  reformulation_dataset: nlpctx/activeqa-telugu-rl-data
  reformulation_train_file: data/indic_rag_te/rule_reformulations/train.jsonl
  reformulation_dev_file: data/indic_rag_te/rule_reformulations/dev.jsonl
  train_examples: null
  eval_examples: null
  eval_fraction: 0.2
models:
  reformulator: ai4bharat/MultiIndicParaphraseGenerationSS
  qa: l3cube-pune/telugu-question-answering-squad-bert
  cache_dir: models
  lora_rank: 16
  lora_alpha: 32
generation:
  # Three independently sampled alternatives per source question, as in a
  # candidate-generation ActiveQA loop.
  candidates_per_question: 3
  max_input_tokens: 96
  max_new_tokens: 64
  do_sample: true
retrieval:
  top_k: 3
  max_context_chars: 1200
training:
  # The available rule-based rewrite pairs are weak silver labels. Keep them
  # out of policy training; optimize sampled alternatives from QA reward.
  sft_warmup: false
  sft_warmup_epochs: 1
  sft_learning_rate: 0.000005
  sft_checkpoint_every_steps: 25
  sft_checkpoint: outputs/external_rl_sft_policy.pt
  # Actual policy-gradient training: sampled reformulations receive REINFORCE
  # updates from downstream answer reward relative to the original question.
  method: reinforce
  epochs: 2
  learning_rate: 0.00001
  batch_questions: 8
  gradient_clip_norm: 1.0
  checkpoint_every_steps: 50
  checkpoint: outputs/external_rl_policy.pt
evaluation:
  # Match the stochastic policy used in training instead of beam search.
  do_sample: true
  reformulation_pair_do_sample: false
  # Reference-free QA confidence with the original question as fallback.
  selection: confidence
  # BM25 diagnostics are ~75% of evaluation QA calls and score ~0.006 F1.
  # Set true for the final reporting run if you want them.
  retrieval_metrics: false
outputs: outputs
