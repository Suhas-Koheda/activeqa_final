[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "activeqa-telugu"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.40,<5", "datasets>=2.19", "rank-bm25>=0.2.2", "peft>=0.11", "PyYAML>=6", "psutil>=5.9", "tqdm>=4.66", "safetensors>=0.4"]
[tool.setuptools.packages.find]
where = ["src"]
